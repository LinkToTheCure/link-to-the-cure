
name: Twitch Donation Shoutouts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-shoutouts:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Preview new donation shoutouts
        shell: python
        env:
          ZEFFY_API_KEY: ${{ secrets.ZEFFY_API_KEY }}
        run: |
          import os
          import json
          import urllib.request

          campaign_id = "00a99422-7c15-4c24-9f9e-6255af83d7a4"

          api_key = os.environ.get("ZEFFY_API_KEY", "").strip()
          if not api_key:
              raise RuntimeError("Zeffy API key is missing")

          with open("announced-donations.json", encoding="utf-8") as file:
              processed = set(json.load(file))

          url = (
              "https://api.zeffy.com/api/v1/payments"
              f"?campaign={campaign_id}&status=succeeded&limit=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Accept": "application/json"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              payments = json.load(response).get("data", [])

          new_payments = [
              payment for payment in payments
              if payment.get("id") not in processed
          ]

          print(f"Previously announced: {len(processed)}")
          print(f"Successful payments retrieved: {len(payments)}")
          print(f"New donations: {len(new_payments)}")

          for payment in new_payments:
              # Do not use the donor's legal name or email.
              # The public nickname field will be added after
              # its API structure is confirmed by a test donation.
              shoutout_name = "an anonymous supporter"

              message = (
                  f"Thank you to {shoutout_name} "
                  "for supporting Link to the Cure!"
              )

              print("Prepared shoutout:", message)

          print("Observation mode only.")
          print("No Twitch messages sent.")
          print("No donation history changed.")
