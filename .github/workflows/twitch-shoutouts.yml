name: Twitch Donation Shoutouts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-shoutout-system:
    runs-on: windows-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Check Zeffy for new donations
        shell: pwsh
        env:
          ZEFFY_API_KEY: ${{ secrets.ZEFFY_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $processed = @(
            Get-Content "announced-donations.json" -Raw |
              ConvertFrom-Json
          )

          $headers = @{
            Authorization = "Bearer $env:ZEFFY_API_KEY"
            Accept = "application/json"
          }

          $response = Invoke-RestMethod `
            -Uri "https://api.zeffy.com/api/v1/payments?campaign=00a99422-7c15-4c24-9f9e-6255af83d7a4&status=succeeded&limit=100" `
            -Headers $headers

          $payments = @($response.data)
          $newPayments = @(
            $payments | Where-Object {
              $_.id -notin $processed
            }
          )

          Write-Host "Previously processed donations: $($processed.Count)"
          Write-Host "Successful donations retrieved: $($payments.Count)"
          Write-Host "New donations awaiting shoutouts: $($newPayments.Count)"
          Write-Host "Observation mode: no donation shoutouts sent."

      - name: Test Twitch chat connection
        shell: pwsh
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_ACCESS_TOKEN: ${{ secrets.TWITCH_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:TWITCH_CLIENT_ID -or -not $env:TWITCH_ACCESS_TOKEN) {
            throw "Twitch credentials are missing."
          }

          $headers = @{
            Authorization = "Bearer $env:TWITCH_ACCESS_TOKEN"
            "Client-Id" = $env:TWITCH_CLIENT_ID
          }

          $user = Invoke-RestMethod `
            -Uri "https://api.twitch.tv/helix/users" `
            -Headers $headers

          if ($user.data[0].login -ne "linktothecure") {
            throw "Unexpected Twitch account. Message not sent."
          }

          $id = $user.data[0].id

          $body = @{
            broadcaster_id = $id
            sender_id = $id
            message = "Link to the Cure donation system: Twitch connection test successful!"
          } | ConvertTo-Json

          $result = Invoke-RestMethod `
            -Uri "https://api.twitch.tv/helix/chat/messages" `
            -Method Post `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $body

          if ($result.data[0].is_sent -ne $true) {
            throw "Twitch did not confirm delivery."
          }

          Write-Host "Twitch test message sent successfully!"
