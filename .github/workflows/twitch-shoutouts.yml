
name: Twitch Donation Shoutouts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-shoutouts:
    runs-on: windows-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Preview new donation shoutouts
        shell: pwsh
        env:
          ZEFFY_API_KEY: ${{ secrets.ZEFFY_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:ZEFFY_API_KEY) {
            throw "Zeffy API key is missing."
          }

          $processed = @(
            Get-Content "announced-donations.json" -Raw |
              ConvertFrom-Json
          )

          $headers = @{
            Authorization = "Bearer $($env:ZEFFY_API_KEY.Trim())"
            Accept = "application/json"
          }

          $url = "https://api.zeffy.com/api/v1/payments?campaign=00a99422-7c15-4c24-9f9e-6255af83d7a4&status=succeeded&limit=100"

          $response = Invoke-RestMethod `
            -Uri $url `
            -Headers $headers

          $payments = @($response.data)

          $newPayments = @(
            $payments | Where-Object {
              $_.id -notin $processed
            }
          )

          Write-Host "Previously announced: $($processed.Count)"
          Write-Host "Successful payments retrieved: $($payments.Count)"
          Write-Host "New donations: $($newPayments.Count)"

          foreach ($payment in $newPayments) {
            $shoutoutName = "an anonymous supporter"

            $message = "Thank you to $shoutoutName for supporting Link to the Cure!"

            Write-Host "Prepared shoutout: $message"
          }

          Write-Host "Observation mode only."
          Write-Host "No Twitch messages sent."
          Write-Host "No donation history changed."
