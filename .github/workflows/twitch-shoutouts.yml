
name: Twitch Donation Shoutouts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-shoutout-fields:
    runs-on: windows-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Inspect Zeffy question structure
        shell: pwsh
        env:
          ZEFFY_API_KEY: ${{ secrets.ZEFFY_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $apiKey = $env:ZEFFY_API_KEY.Trim()
          if (-not $apiKey) {
            throw "Zeffy API key is missing."
          }

          $processed = @(
            Get-Content "announced-donations.json" -Raw |
              ConvertFrom-Json
          )

          $headers = @{
            Authorization = "Bearer $apiKey"
            Accept = "application/json"
          }

          $url = "https://api.zeffy.com/api/v1/payments?campaign=00a99422-7c15-4c24-9f9e-6255af83d7a4&status=succeeded&limit=100"

          $response = Invoke-RestMethod -Uri $url -Headers $headers

          $newPayments = @(
            $response.data | Where-Object {
              $_.id -notin $processed
            }
          )

          Write-Host "New donations detected: $($newPayments.Count)"

          foreach ($payment in $newPayments) {
            Write-Host "Inspecting donation response structure:"

            foreach ($field in $payment.PSObject.Properties) {
              Write-Host "Top-level field: $($field.Name)"
            }

            if ($payment.PSObject.Properties.Name -contains "buyer_questions") {
              Write-Host "Buyer questions field exists."

              $questions = $payment.buyer_questions

              if ($null -eq $questions) {
                Write-Host "Buyer questions: null"
              }
              elseif ($questions -is [array]) {
                Write-Host "Buyer questions: array"

                foreach ($question in $questions) {
                  foreach ($property in $question.PSObject.Properties) {
                    Write-Host "Question property: $($property.Name)"
                  }
                }
              }
              else {
                Write-Host "Buyer questions: object"

                foreach ($property in $questions.PSObject.Properties) {
                  Write-Host "Question property: $($property.Name)"
                }
              }
            }
          }

          Write-Host "Structure inspection complete."
          Write-Host "No donor information displayed."
          Write-Host "No Twitch messages sent."
          Write-Host "No donation history changed."
