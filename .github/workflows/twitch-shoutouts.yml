name: Twitch Donation Shoutouts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-shoutout-system:
    runs-on: windows-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Check Zeffy for new donations
        shell: pwsh
        env:
          ZEFFY_API_KEY: ${{ secrets.ZEFFY_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:ZEFFY_API_KEY) {
            throw "Zeffy API key is missing."
          }

          $processed = @(
            Get-Content "announced-donations.json" -Raw |
              ConvertFrom-Json
          )

          $headers = @{
            Authorization = "Bearer $env:ZEFFY_API_KEY"
            Accept = "application/json"
          }

          $response = Invoke-RestMethod `
            -Uri "https://api.zeffy.com/api/v1/payments?campaign=00a99422-7c15-4c24-9f9e-6255af83d7a4&status=succeeded&limit=100" `
            -Headers $headers

          $payments = @($response.data)
          $newPayments = @(
            $payments | Where-Object {
              $_.id -notin $processed
            }
          )

          Write-Host "Previously processed donations: $($processed.Count)"
          Write-Host "Successful donations retrieved: $($payments.Count)"
          Write-Host "New donations awaiting shoutouts: $($newPayments.Count)"
          Write-Host "Observation mode: no messages sent."

      - name: Verify Twitch application credentials
        shell: pwsh
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:TWITCH_CLIENT_ID -or -not $env:TWITCH_CLIENT_SECRET) {
            throw "Twitch application credentials are missing."
          }

          Write-Host "Twitch application credentials are available."
          Write-Host "Refresh token untouched. No Twitch messages sent."
