
name: Twitch Donation Shoutouts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twitch-donation-shoutouts
  cancel-in-progress: false

jobs:
  announce-donations:
    runs-on: windows-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Announce new donations
        shell: pwsh
        env:
          ZEFFY_API_KEY: ${{ secrets.ZEFFY_API_KEY }}
          TWITCH_ACCESS_TOKEN: ${{ secrets.TWITCH_ACCESS_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($name in @(
            "ZEFFY_API_KEY",
            "TWITCH_ACCESS_TOKEN",
            "TWITCH_CLIENT_ID"
          )) {
            if (-not (Get-Item "Env:$name").Value) {
              throw "Missing credential: $name"
            }
          }

          $processed = @(
            Get-Content "announced-donations.json" -Raw |
              ConvertFrom-Json
          )

          $zeffyHeaders = @{
            Authorization = "Bearer $($env:ZEFFY_API_KEY.Trim())"
            Accept = "application/json"
          }

          # Production query: only payments marked succeeded.
          $url = "https://api.zeffy.com/api/v1/payments?campaign=00a99422-7c15-4c24-9f9e-6255af83d7a4&status=succeeded&limit=100"

          $response = Invoke-RestMethod `
            -Uri $url `
            -Headers $zeffyHeaders

          $payments = @($response.data)

          Write-Host "Payments returned by Zeffy API: $($payments.Count)"

          # Diagnostic only: compare with payments returned
          # when the status filter is removed.
          # This section does not send shoutouts or change records.
          $diagnosticUrl = $url.Replace("&status=succeeded", "")

          $diagnosticResponse = Invoke-RestMethod `
            -Uri $diagnosticUrl `
            -Headers $zeffyHeaders

          $diagnosticPayments = @($diagnosticResponse.data)

          $filteredIds = @(
            $payments | ForEach-Object { $_.id }
          )

          $excludedPayments = @(
            $diagnosticPayments | Where-Object {
              $_.id -notin $filteredIds
            }
          )

          Write-Host "Payments without status filter: $($diagnosticPayments.Count)"
          Write-Host "Payments excluded by succeeded filter: $($excludedPayments.Count)"

          foreach ($payment in $excludedPayments) {
            $status = [string]$payment.status

            if ([string]::IsNullOrWhiteSpace($status)) {
              $status = "(missing or empty)"
            }

            Write-Host "Excluded payment status: $status"
          }

          # Normal donation announcement processing.
          $newPayments = @(
            $payments | Where-Object {
              $_.id -notin $processed
            } | Sort-Object created
          )

          Write-Host "Previously announced: $($processed.Count)"
          Write-Host "New donations detected: $($newPayments.Count)"

          $twitchHeaders = @{
            Authorization = "Bearer $($env:TWITCH_ACCESS_TOKEN.Trim())"
            "Client-Id" = $env:TWITCH_CLIENT_ID.Trim()
          }

          # Official Link to the Cure Twitch account.
          $twitchUserId = "418888011"

          foreach ($payment in $newPayments) {
            $shoutoutName = "an anonymous supporter"

            $matchingQuestions = @(
              $payment.buyer_questions | Where-Object {
                $_.question -like "*Twitch livestream shout-out*"
              }
            )

            if ($matchingQuestions.Count -eq 1) {
              $answer = $matchingQuestions[0].answer

              if ($answer -is [string] -and
                  -not [string]::IsNullOrWhiteSpace($answer)) {
                $candidate = $answer.Trim()

                # Keep chat messages safe and readable.
                $candidate = $candidate -replace '[\r\n\t]', ' '
                $candidate = $candidate -replace '[^\p{L}\p{N}_ .-]', ''
                $candidate = $candidate.Trim()

                if ($candidate.Length -gt 40) {
                  $candidate = $candidate.Substring(0, 40)
                }

                if ($candidate) {
                  $shoutoutName = $candidate
                }
              }
            }

            # Zeffy reports the payment amount in cents.
            if ($null -eq $payment.amount -or
                $null -eq $payment.currency) {
              throw "Payment is missing amount or currency."
            }

            $amount = ([decimal]$payment.amount) / 100

            $formattedAmount = $amount.ToString(
              "F2",
              [System.Globalization.CultureInfo]::InvariantCulture
            )

            $currency = [string]$payment.currency

            if ($currency -ne "CAD") {
              throw "Unexpected payment currency."
            }

            $message = "Thank you to $shoutoutName for contributing `$$formattedAmount CAD in support of Wayout Recovery Society through Link to the Cure!"

            $body = @{
              broadcaster_id = $twitchUserId
              sender_id = $twitchUserId
              message = $message
            } | ConvertTo-Json

            $result = Invoke-RestMethod `
              -Uri "https://api.twitch.tv/helix/chat/messages" `
              -Method Post `
              -Headers $twitchHeaders `
              -ContentType "application/json" `
              -Body $body

            if (-not $result.data -or
                $result.data[0].is_sent -ne $true) {
              throw "Twitch did not confirm the shoutout."
            }

            Write-Host "Twitch confirmed a donation shoutout."

            # Record the payment only after Twitch confirms.
            $processed += $payment.id

            $json = ConvertTo-Json -InputObject @($processed)

            Set-Content `
              -Path "announced-donations.json" `
              -Value $json `
              -Encoding utf8

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            
           git add announced-donations.json
           git commit -m "Record announced Twitch donation"

           $pushSucceeded = $false

          for ($attempt = 1; $attempt -le 5; $attempt++) {
          Write-Host "Saving donation record (attempt $attempt of 5)..."

           git pull --rebase

          if ($LASTEXITCODE -ne 0) {
          throw "Could not synchronize donation records."
          }

          git push

          if ($LASTEXITCODE -eq 0) {
          $pushSucceeded = $true
          break
          }

          Write-Host "GitHub branch changed. Retrying save..."
          Start-Sleep -Seconds 2
          }

          if (-not $pushSucceeded) {
          throw "Could not save donation record after 5 attempts."
          }

          Write-Host "Donation recorded as announced."

          }

          Write-Host "Shoutout processing complete."
