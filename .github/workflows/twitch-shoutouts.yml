
name: Twitch Donation Shoutouts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-shoutout-answer:
    runs-on: windows-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Verify optional Twitch nickname
        shell: pwsh
        env:
          ZEFFY_API_KEY: ${{ secrets.ZEFFY_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $apiKey = $env:ZEFFY_API_KEY.Trim()

          if (-not $apiKey) {
            throw "Zeffy API key is missing."
          }

          $processed = @(
            Get-Content "announced-donations.json" -Raw |
              ConvertFrom-Json
          )

          $headers = @{
            Authorization = "Bearer $apiKey"
            Accept = "application/json"
          }

          $url = "https://api.zeffy.com/api/v1/payments?campaign=00a99422-7c15-4c24-9f9e-6255af83d7a4&status=succeeded&limit=100"

          $response = Invoke-RestMethod -Uri $url -Headers $headers

          $newPayments = @(
            $response.data | Where-Object {
              $_.id -notin $processed
            }
          )

          Write-Host "New donations detected: $($newPayments.Count)"

          foreach ($payment in $newPayments) {
            $questions = @($payment.buyer_questions)

            $matchingQuestions = @(
              $questions | Where-Object {
                $_.question -like "*Twitch livestream shout-out*"
              }
            )

            Write-Host "Matching Twitch questions: $($matchingQuestions.Count)"

            foreach ($question in $matchingQuestions) {
              $answer = $question.answer

              if ($null -eq $answer) {
                Write-Host "Twitch nickname answer: missing"
              }
              elseif ($answer -is [string]) {
                if ([string]::IsNullOrWhiteSpace($answer)) {
                  Write-Host "Twitch nickname answer: empty"
                }
                else {
                  Write-Host "Twitch nickname answer: present (text)"
                }
              }
              else {
                Write-Host "Twitch nickname answer: present (non-text)"
              }
            }
          }

          Write-Host "Verification complete."
          Write-Host "No nickname values displayed."
          Write-Host "No Twitch messages sent."
          Write-Host "No donation history changed."
