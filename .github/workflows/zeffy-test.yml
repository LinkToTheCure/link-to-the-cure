
name: Zeffy Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-zeffy:
    runs-on: windows-latest

    steps:
      - name: Test Zeffy API connection
        shell: pwsh
        env:
          ZEFFY_API_KEY: ${{ secrets.ZEFFY_API_KEY }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:ZEFFY_API_KEY"
            Accept = "application/json"
          }

          try {
            $response = Invoke-WebRequest `
              -Uri "https://api.zeffy.com/api/v1/campaigns?limit=10" `
              -Headers $headers

            Write-Host "Zeffy HTTP status: $($response.StatusCode)"

            $campaigns = ($response.Content | ConvertFrom-Json).data
            $campaign = $campaigns | Where-Object {
              $_.title -eq "Link to the Cure: New Game+"
            }

            if (-not $campaign) {
              throw "LttC campaign not found."
            }

            $total = [decimal]$campaign.volume / 100
            Write-Host ("Donation total: {0:N2} CAD" -f $total)
          }
          catch {
            Write-Error "Zeffy connection test failed."
            exit 1
          }
