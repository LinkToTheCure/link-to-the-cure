
name: Zeffy Donation Updater

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeffy-donation-updater
  cancel-in-progress: false

jobs:
  update-donations:
    runs-on: windows-latest

    steps:
      - name: Download website files
        uses: actions/checkout@v4

      - name: Retrieve Zeffy donation total
        shell: pwsh
        env:
          ZEFFY_API_KEY: ${{ secrets.ZEFFY_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:ZEFFY_API_KEY) {
            throw "Zeffy API key is missing."
          }

          $headers = @{
            Authorization = "Bearer $env:ZEFFY_API_KEY"
            Accept = "application/json"
          }

          $response = Invoke-WebRequest `
            -Uri "https://api.zeffy.com/api/v1/campaigns?limit=10" `
            -Headers $headers

          if ($response.StatusCode -ne 200) {
            throw "Zeffy API request failed."
          }

          $campaign = ($response.Content | ConvertFrom-Json).data |
            Where-Object {
              $_.id -eq "00a99422-7c15-4c24-9f9e-6255af83d7a4"
            }

          if (-not $campaign) {
            throw "NG+ campaign not found."
          }

          $total = [decimal]$campaign.volume / 100

          $data = [ordered]@{
            total = $total
            currency = "CAD"
          }

          $json = $data | ConvertTo-Json
          [System.IO.File]::WriteAllText(
            "donation-total.json",
            $json + "`n",
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host ("Zeffy total: {0:N2} CAD" -f $total)

      - name: Publish updated total
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add donation-total.json

          if (git diff --cached --quiet) {
            Write-Host "No donation changes. Nothing to publish."
          }
          else {
            git commit -m "Update Zeffy donation total"
            git push
            Write-Host "Donation total published successfully."
          }
