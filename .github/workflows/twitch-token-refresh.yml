name: Twitch Token Refresh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-credentials:
    runs-on: windows-latest

    steps:
      - name: Verify GitHub secret management access
        shell: pwsh
        env:
          LTTC_SECRETS_TOKEN: ${{ secrets.LTTC_SECRETS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:LTTC_SECRETS_TOKEN) {
            throw "GitHub secret management token is missing."
          }

          $headers = @{
            Authorization = "Bearer $env:LTTC_SECRETS_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $response = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/LinkToTheCure/link-to-the-cure/actions/secrets/public-key" `
            -Headers $headers

          if (-not $response.key_id -or -not $response.key) {
            throw "GitHub did not return a usable encryption key."
          }

          Write-Host "GitHub secret management access verified."
          Write-Host "No secrets changed."
          Write-Host "No Twitch tokens refreshed."
