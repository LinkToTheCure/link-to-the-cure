
name: Twitch Token Refresh

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twitch-token-refresh
  cancel-in-progress: false

jobs:
  refresh-tokens:
    runs-on: ubuntu-latest

    steps:
      - name: Install encryption library
        run: python -m pip install pynacl

      - name: Refresh Twitch credentials and save securely
        shell: python
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_REFRESH_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN }}
          LTTC_SECRETS_TOKEN: ${{ secrets.LTTC_SECRETS_TOKEN }}
        run: |
          import os
          import json
          import base64
          import urllib.parse
          import urllib.request
          import urllib.error
          from nacl import public, encoding

          repo = "LinkToTheCure/link-to-the-cure"

          def credential(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  raise RuntimeError(f"Missing credential: {name}")
              return value

          client_id = credential("TWITCH_CLIENT_ID")
          client_secret = credential("TWITCH_CLIENT_SECRET")
          refresh_token = credential("TWITCH_REFRESH_TOKEN")
          github_token = credential("LTTC_SECRETS_TOKEN")

          github_headers = {
              "Authorization": "Bearer " + github_token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          def github_request(path, method="GET", payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")

              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + path,
                  data=data,
                  headers=github_headers,
                  method=method
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.status, response.read()

          # Confirm GitHub encryption access before refreshing.
          _, key_response = github_request(
              "/actions/secrets/public-key"
          )
          key_info = json.loads(key_response)

          public_key = public.PublicKey(
              key_info["key"].encode("utf-8"),
              encoding.Base64Encoder()
          )
          sealed_box = public.SealedBox(public_key)

          # Request replacement Twitch credentials.
          form = urllib.parse.urlencode({
              "client_id": client_id,
              "client_secret": client_secret,
              "grant_type": "refresh_token",
              "refresh_token": refresh_token
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://id.twitch.tv/oauth2/token",
              data=form,
              headers={
                  "Content-Type": "application/x-www-form-urlencoded"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  tokens = json.load(response)
          except urllib.error.HTTPError as error:
              print(f"Twitch refresh failed: HTTP {error.code}")
              raise RuntimeError(
                  "Twitch rejected the refresh request."
              ) from None

          if not tokens.get("access_token") or not tokens.get("refresh_token"):
              raise RuntimeError("Twitch returned incomplete credentials")

          print("Twitch issued replacement credentials.")

          # Save the replacement refresh token first.
          for name in ["TWITCH_REFRESH_TOKEN", "TWITCH_ACCESS_TOKEN"]:
              field = (
                  "refresh_token"
                  if name == "TWITCH_REFRESH_TOKEN"
                  else "access_token"
              )

              encrypted = sealed_box.encrypt(
                  tokens[field].encode("utf-8")
              )

              payload = {
                  "encrypted_value": base64.b64encode(
                      encrypted
                  ).decode("ascii"),
                  "key_id": key_info["key_id"]
              }

              status, _ = github_request(
                  "/actions/secrets/" + name,
                  method="PUT",
                  payload=payload
              )

              if status not in (201, 204):
                  raise RuntimeError(f"Failed to update {name}")

              print(f"{name} updated successfully.")

          print("Twitch credential refresh completed.")
