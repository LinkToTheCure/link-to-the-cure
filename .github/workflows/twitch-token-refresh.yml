
name: Twitch Token Refresh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-credentials:
    runs-on: ubuntu-latest

    steps:
      - name: Check Twitch credential formatting
        shell: python
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_REFRESH_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN }}
          LTTC_SECRETS_TOKEN: ${{ secrets.LTTC_SECRETS_TOKEN }}
        run: |
          import os

          required = [
              "TWITCH_CLIENT_ID",
              "TWITCH_CLIENT_SECRET",
              "TWITCH_REFRESH_TOKEN",
              "LTTC_SECRETS_TOKEN"
          ]

          for name in required:
              value = os.environ.get(name, "")

              if not value:
                  raise RuntimeError(f"{name} is missing")

              if value != value.strip():
                  raise RuntimeError(
                      f"{name} contains surrounding whitespace"
                  )

              if "\n" in value or "\r" in value:
                  raise RuntimeError(
                      f"{name} contains an unexpected line break"
                  )

              print(f"{name}: present and correctly formatted")

          print("Credential format checks completed.")
          print("No Twitch requests made.")
          print("No GitHub secrets changed.")
